# 篩（ふるい）：提案を、まとめて・一般化して・影響で振り分けてから入れる。
# 起きるのは出来事のときだけ：Discord の /propose・「Propose to Commons」（受け口から sieve-intake）、
# 提案の Issue を作る、篩のカードにコメントする。定期実行は使わない。
# 本体は commons-ground/ground の sieve.yml。仕組みは ground の tools/sieve/README.md、設計は docs/sieve.md。
name: sieve

on:
  repository_dispatch:
    types: [sieve-intake]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  sieve:
    uses: commons-ground/ground/.github/workflows/sieve.yml@main
    with:
      member_dir: discord
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
