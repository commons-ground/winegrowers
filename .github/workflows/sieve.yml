# 篩（ふるい）：提案を、まとめて・一般化して・影響で振り分けてから入れる。
# 起きるのは出来事のときだけ：Discord の /propose・「コモンズに提案」（受け口から discord-propose。#提案 に載せる仕事と同時に動く）、
# #提案 に直接書いた発言（ground の中継 tools/discord-agents が毎分の見回りのついでに sieve-intake で送る）、
# 提案の Issue を作る、篩のカードにコメントする。定期実行は使わない。
# 本体は commons-ground/ground の sieve.yml。仕組みは ground の tools/sieve/README.md、設計は docs/sieve.md。
name: sieve

on:
  repository_dispatch:
    # discord-propose は /propose・「コモンズに提案」、sieve-intake は #提案 に直接書いた発言（中継が見つけて送る）
    types: [discord-propose, sieve-intake]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  sieve:
    uses: commons-ground/ground/.github/workflows/sieve.yml@main
    with:
      member_dir: discord
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      # 篩のアプリ（Commons Sieve）。行き先が ground の提案も、篩が直接プルリクエストにする
      SIEVE_APP_ID: ${{ secrets.SIEVE_APP_ID }}
      SIEVE_APP_PRIVATE_KEY: ${{ secrets.SIEVE_APP_PRIVATE_KEY }}
