name: auto-merge
# プルリクエストが出たら自動マージを予約する。main のブランチ保護で必須にしたチェック
# （validate と guard＝門番）がすべて通った時点で main に入る。
# 人の判断が要るものは門番が止めて、理由を書いて人に回す（tools/guard/check.py）。
# 団体の外（フォーク）からのプルリクエストは予約しない。下書きも予約しない。
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: write
  pull-requests: write
jobs:
  auto-merge:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: 自動マージを予約する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR"
