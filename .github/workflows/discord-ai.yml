# Discord「Winegrowers Commons」の /ai に答える。
# 受け口（Cloudflare Worker）→ repository_dispatch → ここ → ground の discord-ai-member。
# 仕組みは commons-ground/ground の tools/discord-ai-member/README.md。
# 鍵は secrets（ANTHROPIC_API_KEY・DISCORD_BOT_TOKEN）にだけ置く。
name: discord-ai

on:
  repository_dispatch:
    # discord-interaction は /ai、discord-mention は @コモンズのAI（ground の中継が見つけて送る）
    types: [discord-interaction, discord-mention]

permissions:
  contents: read
  issues: write  # AI の〔覚えておく〕を Issue「覚えておく候補」にためる（ground の discord-ai-member）

jobs:
  reply:
    uses: commons-ground/ground/.github/workflows/discord-ai-member.yml@main
    with:
      payload: ${{ toJSON(github.event.client_payload) }}
      member_dir: discord
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
